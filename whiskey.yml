
Build:
- PowerShell: prism install | Format-Table -Auto
  .ExceptDuring: Clean

- Version:
    Path: Zip\Zip.psd1
    IncrementPrereleaseVersion: true
    Prerelease:
    - main: ""
    - "*": rc1

# Update the AppVeyor build/version number.
- Exec: appveyor UpdateBuild -Version "$(WHISKEY_SEMVER2)+$(WHISKEY_BUILD_NUMBER)"
  .OnlyBy: BuildServer

# Dot-sourcing files is expensive. Move all functions into .psm1 file to improve import speed. Do this before testing
# to ensure the module still works.
- MergeFile:
    .OnlyBy: BuildServer
    # Builds run twice on some serves. Only run this step if the module hasn't been merged yet.
    .IfExists: Zip\Functions\*.ps1
    Path:
    - Zip\Functions\*.ps1
    DestinationPath: Zip\Zip.psm1
    DeleteSourceFiles: true
    TextSeparator: "$(NewLine)$(NewLine)"

- CopyFile:
    Path:
    - CHANGELOG.md
    - README.md
    - LICENSE.txt
    - NOTICE.txt
    DestinationDirectory: Zip

- Zip:
    ArchivePath: .output\Zip-$(WHISKEY_SEMVER2).zip
    Path:
    - Zip
    Exclude:
    - "*.pdb"
    - "*.orig"

- Exec: appveyor PushArtifact '.output/Zip-$(WHISKEY_SEMVER2).zip' -DeploymentName 'GitHub'
  .OnlyBy: BuildServer

- Pester:
    Configuration:
        Run:
            Path: Tests\*.Tests.ps1
            Exit: true
            Throw: true
        TestResult:
            Enabled: true
            OutputPath: .output\pester.xml
            TestSuiteName: Zip
        Output:
            Verbosity: Detailed

- PublishPowerShellModule:
    Path: Zip

- Exec: appveyor PushArtifact '.output/Zip.$(WHISKEY_SEMVER2_NO_BUILD_METADATA).nupkg' -DeploymentName 'PowerShellGallery'
  .OnlyBy: BuildServer